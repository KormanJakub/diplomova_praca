<main class="reset-page">
  <h1>Obnova hesla</h1>
  <p>Zadajte email svojho účtu. Pošleme vám jednorazový kód platný 15 minút.</p>

  <form (ngSubmit)="requestReset()">
    <label for="reset-email">Email</label>
    <input id="reset-email" name="email" type="email" autocomplete="email"
           [(ngModel)]="email" required>
    <button type="submit" [disabled]="busy || !email">Poslať kód</button>
  </form>

  <form (ngSubmit)="resetPassword()">
    <label for="reset-token">Kód z emailu</label>
    <input id="reset-token" name="token" type="text" autocomplete="one-time-code"
           [(ngModel)]="token" required>
    <label for="new-password">Nové heslo</label>
    <input id="new-password" name="newPassword" type="password" autocomplete="new-password"
           [(ngModel)]="newPassword" minlength="6" required>
    <label for="repeat-password">Zopakovať nové heslo</label>
    <input id="repeat-password" name="repeatNewPassword" type="password" autocomplete="new-password"
           [(ngModel)]="repeatNewPassword" minlength="6" required>
    <button type="submit" [disabled]="busy || !email || !token || !newPassword || !repeatNewPassword">
      Zmeniť heslo
    </button>
  </form>

  <p role="status" aria-live="polite">{{message}}</p>
</main>
